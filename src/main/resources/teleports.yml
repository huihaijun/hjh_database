points:
  选择人族-前往新手前置:
    world: "world"  # 对应 minecraft:overworld，通常服务器文件夹名叫 world
    x: 1248.05
    y: 35.00
    z: -364.01
    yaw: 89.40      # 449.40 - 360 = 89.40 (角度归一化，效果一样)
    pitch: 2.10
    actions:
      # 这里填写我们在代码里定义的代号
      custom_action: "CHOOSE_HUMAN_START"
      message: "&7你选择了[人族]，正在前往新手前置之地"

