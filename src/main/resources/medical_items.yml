# medical_items.yml
# 定义医术秘籍，玩家通过获得这些物品在绘制台使用
# id对应代码中的 skillId

items:
  yuhehua:
    name: "&f愈合花"
    material: PAPER
    rarity: 1 # 自定义字段，代码里读取
    skill_id: "yuhehua"
    # === 新增配置 (代码会自动读取这里) ===
    mana_cost: 3.0       # 灵力消耗
    cooldown: 7.0        # 冷却时间 (秒)
    duration: 10         # 自定义参数：持续时间 (YuHeHuaSpell 里用的)
    cast_message: "&e%player% &f凭借医旗施法医术 —— &a愈合花&f！"
    lore:
      - "&7&o医师的初始医术,能够催动灵力在身边绽开花朵"
      - "&7&o拾起花朵的人身心大悦,心身治愈"
      - "&8==============&2&l&n医术详情&8==============="
      - "&e[右键释放] &f冷却：&b7&f秒 消耗灵力：&b3&f点"
      - "&f释放后，在身旁生成三朵花朵持续&b10&f秒"
      - "&f每朵花将恢复拾起者基于你阵法强度&b20%&f的生命"
      - "&c&l放入绘制台以绘制" # 这行在绘制时会自动被代码滤除
      -
  tuidi:
    name: "&f退敌"
    material: PAPER
    rarity: 1
    skill_id: "tuidi"
    # === 技能参数 ===
    mana_cost: 5.0          # 灵力消耗
    cooldown: 5.0           # 冷却时间 5秒
    range: 4.0              # 范围：半径4
    damage_ratio: 0.9       # 伤害倍率：90% 阵法强度
    knockback_strength: 0.8 # 击退力度 (1.5 已经挺大了)
    # 释放消消息
    cast_message: "&e%player% &f凭借医旗施法医术 —— &e退敌&f！"
    lore:
      - "&7&o医师的基础护身术，能够将周边冒犯之人击退"
      - "&7&o看似威力十足，实际只有他们清楚这只是恐吓……"
      - "&8==============&2&l&n医术详情&8==============="
      - "&e[右键释放] &f冷却：&b5&f秒 消耗灵力：&b5&f点"
      - "&f对周围&b4格&f内的怪物造成&b90%&f阵法强度的伤害"
      - "&f并同时对它们施加小幅度的击退效果"
      - "&c&l放入绘制台以绘制"