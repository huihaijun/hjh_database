# 交互道具 如羽毛 传送卷轴等
wangchuanshui:
  material: OMINOUS_BOTTLE
  name: "&c忘川水"
  lore:
    - "&7&o漆黑如渊,一双猩红瞳光于瓶底幽幽闪烁,似在凝视过往"
    - "&7&o饮下此水,前世种种尽归虚无,唯余一片混沌,以待新生"
    - "&7============================================="
    - "&f[注意]:请在皇城的&c[转生祭坛]&f附近使用"
    - "&c&l功能尚在测试,请谨慎使用,使用前请联系管理员!"

tianjiling:
  material: CLOCK
  name: "&6&l天机令"
  lore:
    - "&6限制职业:无"
