  material: PAPER
  name: "&6灵田契"
  lore:
    - "&7可将一块指定灵田绑定为自己的田位"

# 示例玩法道具。效果由 FarmGrowthTorchEffect 硬编码。
farm_growth_torch:
  material: SOUL_TORCH
  name: "&b生机火把"
  lore:
    - "&7&o神奇的火把"
    - "&7&o能够加速一块农田30秒的生长时间"

