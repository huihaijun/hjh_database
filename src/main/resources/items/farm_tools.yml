# 系统布点工具（管理员使用）。
farm_field:
  material: FARMLAND
  name: "&6灵田"
  lore:
    - "&7管理员放置后注册为公共灵田田位"

farm_controller_bell:
  material: BELL
  name: "&6灵田观测钟"
  lore:
    - "&7管理员放置后可用于查看附近灵田"

# 玩家购买后，手持并右键一块尚未绑定的灵田。
