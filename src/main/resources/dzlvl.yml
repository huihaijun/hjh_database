# dzlvl.yml - 锻造等级与资质配置

# 锻造等级经验表
# 格式: 等级: 升级所需经验 (即从当前等级升到下一级需要的经验)
# 例如: 1: 100 表示从 1级 升到 2级 需要 100 经验
levels:
  1: 100
  2: 250
  3: 500
  4: 1000
  5: 2000
  6: 5000
  7: 10000
  8: 20000
  9: 50000
  10: 100000

# 锻造资质名称
# 格式: 资质ID: 显示名称
licenses:
  0: "&7无资质"
  1: "&f初级铁匠"
  2: "&a中级铁匠"
  3: "&b高级铁匠"
  4: "&d锻造大师"
  5: "&6神匠"