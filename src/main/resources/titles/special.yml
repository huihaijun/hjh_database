titles:
  jianghuxianquzhe:
    material: NETHER_STAR
    name: "&x&f&c&8&a&0&0江&x&f&7&6&a&0&2湖&x&f&2&4&a&0&5先&x&e&c&2&9&0&7驱&x&e&7&0&9&0&9者"
    lore:
      - "&8======================="
      - "&7&o献给最早踏入这片江湖的侠客"
      - "&7&o感谢他们在内测期间留下的每一份反馈与建议"
      - "&7&o也感谢他们为江湖完善与成长作出的贡献"
      - ""
      - "&6获得方式:"
      - "&f参与《画江湖》S1 内测的玩家获得"
      - "&8======================="

  rumengling:
    material: NETHER_STAR
    name: "&#f36868&l纤&#ef7e7e&l云&#ec9393&l弄&#e8a9a9&l巧"
    lore:
      - "&8======================="
      - "&7&o纤云弄巧，飞星传恨，银汉迢迢暗度"
      - "&7&o金风玉露一相逢，便胜却人间无数"
      - "&7&o柔情似水，佳期如梦，忍顾鹊桥归路"
      - "&7&o两情若是久长时，又岂在朝朝暮暮"
      - ""
      - "&6获得方式:"
      - "&f七夕节19:30-22:30登录获取"
      - "&8======================="

  zanzhus1:
    material: NAME_TAG
    name: "&#eebf9b山&#d9d3bc抹&#c4e8dc微&#affcfd云"
    lore:
      - "&8======================="
      - "&7&o山抹微云，天连衰草，画角声断谯门。"
      - "&7&o暂停征棹，聊共引离尊。多少蓬莱旧事，空回首，烟霭纷纷。"
      - "&7&o斜阳外，寒鸦万点，流水绕孤村。"
      - "&7&o销魂，当此际，香囊暗解，罗带轻分。"
      - "&7&o谩赢得青楼，薄幸名存。此去何时见也，襟袖上，空惹啼痕。"
      - "&7&o伤情处，高城望断，灯火已黄昏。"
      - ""
      - "&6获得方式:"
      - "&f赠予S1赞助的玩家"
      - "&8======================="

  zhongyuan:
    material: NAME_TAG
    name: "&#70694c长&#7d665d日&#8b646e沉&#98617f冥"
    lore:
      - "&8======================="
      - "&6获得方式:"
      - "&f中元夜21:00-23:00登录获得"
      - "&8======================="