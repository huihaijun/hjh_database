# 云游称号。配置顺序即同解锁状态下的菜单顺序。
titles:
  ren_xierenjianyanhuofushanhai:
    material: COMPASS
    name: "&a赴山海"
    lore:
      - "&8======================="
      - "&7&o走出山川峡谷，也懂得坚韧与同心"
      - "&7&o从此带着女娲的祝福，把人间第一程走向四方"
      - ""
      - "&6获得方式:"
      - "&f完成人族前期主线（一至九）后获得"
      - "&8======================="

  shen_ziyunquexiawenrenjian:
    material: FEATHER
    name: "&b云阙下问人间"
    lore:
      - "&8======================="
      - "&7&o因圣山异动离开神域，自云阙步入尘世"
      - "&7&o不再遥望众生，而以自己的脚步叩问人间"
      - ""
      - "&6获得方式:"
      - "&f完成神族前期主线（一至九）后获得"
      - "&8======================="

  yao_yelinggujichudexiwang:
    material: VINE
    name: "&d叶灵谷的希望"
    lore:
      - "&8======================="
      - "&7&o背负谷主的嘱托潜入皇城，追寻被囚的长老"
      - "&7&o身后是受难的同族，前路是妖族复兴的一线希望"
      - ""
      - "&6获得方式:"
      - "&f完成妖族前期主线（一至九）后获得"
      - "&8======================="

  nan_lianxinzuihoudemoshengren:
    material: RED_SAND
    name: "&c最后的陌生人"
    lore:
      - "&8======================="
      - "&7&o接过莲心留给陌生人的最后一封信"
      - "&7&o你的善意让复仇尽头的她，再一次看见人间温情"
      - ""
      - "&6获得方式:"
      - "&f完成南方焱砂大漠区域主线后获得"
      - "&8======================="

  xi_tiweiguirenbaopingan:
    material: BAMBOO
    name: "&f一声平安，一生平安"
    lore:
      - "&8======================="
      - "&7&o穿过虎瘴与迷途，替一位父亲寻到久候的音讯"
      - "&7&o也替无法归家的虎子，把牵挂送回故乡"
      - ""
      - "&6获得方式:"
      - "&f完成西方虎爪山脉区域主线后获得"
      - "&8======================="

  bei_huanxingxuanshuishengjideren:
    material: HEART_OF_THE_SEA
    name: "&3洄游季的大功臣"
    lore:
      - "&8======================="
      - "&7&o汇聚五行之力，令沉眠的珊瑚重新焕发生机"
      - "&7&o玄水村因你得以延续，洄游季也因你更精彩"
      - ""
      - "&6获得方式:"
      - "&f完成北方玄水湖泊区域主线后获得"
      - "&8======================="
