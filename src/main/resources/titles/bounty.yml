# 赏金称号。管理员可用 /hjhadmin title give <玩家> <称号ID> 直接给予。
titles:
  jiufengyuge:
    material: NETHER_WART
    name: "&e救蜂于歌"
    lore:
      - "&8======================="
      - "&7&o一只蜂逃出了大歌星的独唱，又被你请回了笼子"
      - "&7&o救得了蜜蜂，未必躲得过恩人的一曲高歌"
      - "&7&o幸好你眼疾手快，连那句『你是……』也拦住了"
      - ""
      - "&6获得方式:"
      - "&f首次完成赏金任务【我的麦克蜂】后获得"
      - "&8======================="

  huchuzhixin:
    material: NETHER_WART
    name: "&e护雏之心"
    lore:
      - "&8======================="
      - "&7&o一支旧钗，藏着幼子的委屈与娘亲的牵挂"
      - "&7&o你替无处可去的孩子叩开府门，让未说出口的苦楚被听见"
      - "&7&o愿归家的路不再惶恐，愿稚嫩的心有所依靠"
      - ""
      - "&6获得方式:"
      - "&f首次完成赏金任务【走丢的少爷】后获得"
      - "&8======================="

  yongbushiliandeai:
    material: NETHER_WART
    name: "&d永不失联的爱"
    lore:
      - "&8======================="
      - "&7&o一缕缎带，牵起林中与大漠两端的思念"
      - "&7&o纵使记忆散落，仍有人守候那一句归来"
      - "&7&o你替漫长的等待寻回音讯，让失散的爱再度相逢"
      - ""
      - "&6获得方式:"
      - "&f首次完成赏金任务【永不失联的爱】后获得"
      - "&8======================="

  xianjingzhiyou:
    material: RABBIT_FOOT
    name: "&a仙境之友"
    lore:
      - "&8======================="
      - "&7&o替一只迷路的小兔子，叩开森林深处的仙境"
      - "&7&o小姑娘的牵挂与兔子王的谢意，都记在这份善意里"
      - "&7&o愿每一颗漂泊的心，都能寻到归家的路"
      - ""
      - "&6获得方式:"
      - "&f首次完成赏金任务【奇妙仙境】后获得"
      - "&8======================="
