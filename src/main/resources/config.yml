database:
  host: "localhost"
  port: "3306"
  name: "hjh_rpg"
  user: "root"
  password: "root"

# 以极短静音 Sound Event 驱动客户端右下角字幕。
# display-cooldown-ticks 只限制字幕数据包，不参与任何技能真实冷却或判定。
passive-subtitles:
  enabled: true
  display-cooldown-ticks: 10

  accessories:
    # 通用新增模板（内部 ID 来自 crystals.yml 的 skill_id/id）：
    # "<饰品内部ID>":
    #   sound-event: "hjh:subtitle.accessory.xxxxx"

    # 本次精准迁移范围：回流仪与炎灵。
    huiliuyi:
      sound-event: "hjh:subtitle.accessory.reflux.triggered"
      event-sounds:
        enabled: "hjh:subtitle.accessory.reflux.enabled"
        disabled: "hjh:subtitle.accessory.reflux.disabled"
    yanling:
      sound-event: "hjh:subtitle.accessory.reflux.triggered"
      event-sounds:
        enabled: "hjh:subtitle.accessory.reflux.enabled"
        disabled: "hjh:subtitle.accessory.reflux.disabled"
        blessing: "hjh:subtitle.accessory.yanling.blessing"
    xunlilingshu:
      # 普通概率回流与卦印必定回流都复用现有的“回流触发”右下角字幕。
      sound-event: "hjh:subtitle.accessory.reflux.triggered"
      event-sounds:
        enabled: "hjh:subtitle.accessory.reflux.enabled"
        disabled: "hjh:subtitle.accessory.reflux.disabled"

  # 固定战斗事件；键由代码使用，值在插件加载/reload时校验并缓存。
