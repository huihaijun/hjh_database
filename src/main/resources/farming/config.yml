# Farming system behavior config. Item appearances live in resources/items/farming.yml.

gui:
  title: "&2&l✦ 灵田药圃 ✦"
  rows: 5
  # 3×3 九宫格灵田槽位（9列中居中：左右各3列留白）
  field_slots:
    - 12
    - 13
    - 14
    - 21
    - 22
    - 23
    - 30
    - 31
    - 32


unlock:
  default_max_fields: 1
  max_total_fields: 9
  item_id: lingtiankaituoling
  costs:
    2: 1
    3: 2
    4: 3
    5: 5
    6: 8
    7: 12
    8: 18
    9: 25


growth:
  tick_interval: 60


events:
  check_interval: 900
  min_online_time: 300
  notification: true
  events:
    # ---- 虫类 ----
    yinmie:
      chance: 0.12
      damage_type: "yield"
      damage_percent: 0.15
      message: "&7[虫害] &f银蠓群至，细如尘埃，啃噬 {player} 的 {plant} 嫩叶，减产一成五。"
      affected_plants: []
    jushu:
      chance: 0.10
      damage_type: "yield"
      damage_percent: 0.25
      message: "&7[虫害] &f锯螽夜袭，锯齿如镰，割裂 {player} 的 {plant} 茎秆，减产二成五。"
      affected_plants: []

    # ---- 天象 ----
    yinfeng:
      chance: 0.08
      damage_type: "delay"
      damage_percent: 0.30
      message: "&7[天象] &b阴风过境，寒气侵骨，{player} 的 {plant} 枝叶瑟缩，生长迟滞三成。"
      affected_plants: []
    shuangjiang:
      chance: 0.06
      damage_type: "destroy"
      damage_percent: 0.30
      message: "&7[天象] &b霜降骤至，冰晶覆叶，{player} 的 {plant} 有三成概率被冻毙。"
      affected_plants: []
    baoyu:
      chance: 0.08
      damage_type: "delay"
      damage_percent: 0.40
      message: "&7[天象] &9暴雨倾盆，泥水漫田，{player} 的 {plant} 根系受损，生长迟滞四成。"
      affected_plants: []

    # ---- 水文 ----
    hanchao:
      chance: 0.08
      damage_type: "delay"
      damage_percent: 0.35
      message: "&7[水文] &3寒潮暗涌，灵泉凝滞，{player} 的 {plant} 汲养受阻，生长迟滞三成五。"
      affected_plants: []
    wushui:
      chance: 0.10
      damage_type: "yield"
      damage_percent: 0.20
      message: "&7[水文] &3浊水浸根，地气污杂，{player} 的 {plant} 灵产受损二成。"
      affected_plants: []

    # ---- 兽类 ----
    tianshu:
      chance: 0.12
      damage_type: "yield"
      damage_percent: 0.20
      message: "&7[兽扰] &e田鼠掘穴，偷食灵根，{player} 的 {plant} 被啃去二成灵产。"
      affected_plants: []
    maque:
      chance: 0.15
      damage_type: "yield"
      damage_percent: 0.15
      message: "&7[兽扰] &e灵雀成群，啄食嫩穗，{player} 的 {plant} 折损一成五。"
      affected_plants: []

    # ---- 异象 ----
    lingli:
      chance: 0.04
      damage_type: "delay"
      damage_percent: 0.50
      message: "&d[异象] &5灵力气旋紊乱，{player} 的 {plant} 身处灵力涡流之中，生长迟滞五成。"
      affected_plants: []
    duteng:
      chance: 0.06
      damage_type: "yield"
      damage_percent: 0.30
      message: "&d[异象] &5毒藤寄生，吸取灵汁，{player} 的 {plant} 被毒藤缠绕，减产三成。"
      affected_plants: []

    # ---- 大地 ----
    dilei:
      chance: 0.06
      damage_type: "delay"
      damage_percent: 0.40
      message: "&7[地脉] &8地脉枯竭，灵气稀薄，{player} 的 {plant} 如陷荒漠，生长迟滞四成。"
      affected_plants: []
    chongtu:
      chance: 0.05
      damage_type: "destroy"
      damage_percent: 0.30
      message: "&7[地脉] &8虫土翻涌，地底幼虫泛滥，{player} 的 {plant} 有三成概率被啃噬殆尽。"
      affected_plants: []

    # ---- 天灾 ----
    hanre:
      chance: 0.05
      damage_type: "yield"
      damage_percent: 0.35
      message: "&c[天灾] &6昼炎夜寒，冷热骤变，{player} 的 {plant} 不堪其扰，减产三成五。"
      affected_plants: []
    tianshuo:
      chance: 0.03
      damage_type: "destroy"
      damage_percent: 0.25
      message: "&c[天灾] &6天火碎屑坠落田间，{player} 的 {plant} 有二成五概率被焚为灰烬。"
      affected_plants: []

    # ---- 病害 ----
    huangwei:
      chance: 0.10
      damage_type: "yield"
      damage_percent: 0.20
      message: "&7[病害] &e黄萎病起，叶片枯焦，{player} 的 {plant} 灵产折损二成。"
      affected_plants: []
    baifen:
      chance: 0.08
      damage_type: "delay"
      damage_percent: 0.25
      message: "&7[病害] &e白粉病菌蔓延，茎叶蒙尘，{player} 的 {plant} 生长迟滞二成五。"
      affected_plants: []

    # ---- 灵异 ----
    guiwu:
      chance: 0.04
      damage_type: "delay"
      damage_percent: 0.45
      message: "&d[灵异] &8鬼雾弥漫，阴魂缭绕，{player} 的 {plant} 被冥气所困，生长迟滞四成五。"
      affected_plants: []


