name: hjh_database
version: '${version}'
main: com.hjh_database.Hjh_database
api-version: '1.21'
commands:
  hjhstats:
    description: 查看属性
    usage: /hjhstats
  hjhweapon:
    description: 武器管理指令
    usage: /hjhweapon
    permission: hjh.op
  hjhadmin:
    description: 管理员修改职业/种族
    usage: /hjhadmin <job|race> <player> <value>
    permission: hjh.admin
  testmob:
    description: 生成测伤怪物
    usage: /testmob <血量> [护甲]
    permission: hjh.op
  zfset:
    description: 阵法系统管理员指令
    permission: hjh.admin
    usage:
      /zfset setlevel <player> <type> <level>
  hjh:
    description: 画江湖核心资源指令
    usage: /hjh <subcommand>
    permission:
      hjh.admin
  # === 【新增】锻造系统指令 ===
  hjhdz:
    description: 锻造系统核心指令
    usage: /hjhdz <station|player|edit|reload>
    permission: hjh.admin
    permission-message: §c你没有权限执行此操作。

  # 在 commands: 下面添加
  hjhkw:
    description: 开物术系统指令 (OP)
    usage: /hjhkw <reload|save>
    permission: hjh.op

  # ... (上面是你原来的 commands 等配置)
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.0.21
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0
  - com.zaxxer:HikariCP:5.1.0